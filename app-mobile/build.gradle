apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def mmlApiKey = localProps.getProperty('MML_API_KEY') ?: System.getenv('MML_API_KEY') ?: ""
def digitransitKey = localProps.getProperty('digitransit_subscription_key') ?: System.getenv('DIGITRANSIT_KEY') ?: ""

android {
    namespace 'org.jrs82.fsclock'
    compileSdk 36
    buildToolsVersion '36.0.0'

    buildFeatures {
        buildConfig true
        compose true
    }

    // Kotlin on lukittu 1.9.24:ään (ks. resolutionStrategy) → Compose-kääntäjä 1.5.14.
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    defaultConfig {
        applicationId 'org.jrs82.arkikeskus'
        minSdk 30
        targetSdk 35
        versionCode 51
        versionName '2.1.0-mobile'
        buildConfigField "String", "MML_API_KEY", "\"${mmlApiKey}\""
        buildConfigField "String", "DIGITRANSIT_KEY", "\"${digitransitKey}\""

        // MapLibren natiivikirjastot vain ARM-laitteille (ei x86-emulaattoreita) —
        // muuten APK paisuu ~53 MB:iin. arm64-v8a + armeabi-v7a kattaa oikeat laitteet.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": rootProject.file('app-mobile/schemas').toString()]
            }
        }
    }

    sourceSets {
        main {
            // Mobiili on itsenäinen: jaettu logiikka/res siirretty app-mobilen omaan core/-puuhun,
            // ei enää riippuvuutta tabletin ../app-moduuliin. Tabletti pysyy jäädytettynä (tablet-2.0).
            java.srcDirs = ['src/main/java', 'core/java']
            res.srcDirs = ['src/main/res', 'core/res']
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "Arkikeskus-${variant.versionName}.apk"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            def ksPw = localProps.getProperty('KEYSTORE_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD')
            def kPw  = localProps.getProperty('KEY_PASSWORD') ?: System.getenv('KEY_PASSWORD')
            if (ksPw && kPw) {
                storeFile rootProject.file('release.keystore')
                storePassword ksPw
                keyAlias 'fsclock'
                keyPassword kPw
            }
        }
    }

    buildTypes {
        debug {
            // Debug-buildit omalle tunnukselle, jotta Android Studion "Run" ei saastuta
            // oikeaa pakettia debug-avaimella (Developer Verification -rekisteröinnin takia).
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // Jetpack Compose (UI-modernisointi). BOM 2024.06.00 = Compose 1.6.8 / Material3 1.2.1,
    // yhteensopiva Kotlin 1.9.24 + compiler 1.5.14:n kanssa.
    def composeBom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.3'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'org.maplibre.gl:android-sdk:11.5.2'
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
}
