<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo B · esikatselu (4:3 / 16:10)</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#04060d;display:grid;place-items:center;overflow:hidden;padding:54px 16px 82px;
    font-family:"Hanken Grotesk",sans-serif}
  .frame{aspect-ratio:16/10;width:min(calc(100vw - 32px),calc((100vh - 136px)*1.6));background:#000;overflow:hidden;border-radius:10px;
    box-shadow:0 20px 70px rgba(0,0,0,.6);border:1px solid #1c2230}
  .frame.r43{aspect-ratio:4/3;width:min(calc(100vw - 32px),calc((100vh - 136px)*1.33333))}
  iframe{width:100%;height:100%;border:0;display:block}
  .toggle{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:6px;
    background:rgba(12,16,30,.92);border:1px solid #2a3550;border-radius:999px;padding:6px}
  .toggle button{background:transparent;border:0;color:#aebbd6;font:700 14px "Hanken Grotesk",sans-serif;
    padding:9px 20px;border-radius:999px;cursor:pointer}
  .toggle button.on{background:#3d7bff;color:#fff}
  .hint{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:#7f8ba1;font-size:13px;white-space:nowrap}
</style>
</head>
<body>
  <div class="hint">Demo B — vaihda näytön kuvasuhdetta alhaalta</div>
  <div class="frame r1610" id="frame"><iframe src="demo2_final.html"></iframe></div>
  <div class="toggle">
    <button id="b1610" class="on" onclick="setAR(false)">16:10 · Tab A9+</button>
    <button id="b43" onclick="setAR(true)">4:3 · Tab S2</button>
  </div>
  <script>
    function setAR(is43){
      document.getElementById('frame').classList.toggle('r43', is43);
      document.getElementById('b43').classList.toggle('on', is43);
      document.getElementById('b1610').classList.toggle('on', !is43);
    }
  </script>
</body>
</html>
