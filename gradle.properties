# HUOM: konekohtaiset asetukset (JDK-polku, SSL-truststore) ovat GRADLE_USER_HOMEn
# gradle.propertiesissa (~/.gradle/) — ne ohittavat tämän tiedoston arvot paikallisesti.
# Tähän tiedostoon EI Windows-polkuja: se ajetaan myös Linux-CI:llä (GitHub Actions).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 muutti R8:n oletusta: pelkkä "-keep class X" ei enää säilytä oletuskonstruktoria. Kirjastojen omat
# säännöt nojaavat siihen yhä (Room 2.6.1: "-keep class * extends androidx.room.RoomDatabase"; tietokannan
# toteutusluokka luodaan reflektiolla). Uudella oletuksella R8 karsi Room-tietokannat ja niiden mukana
# WorkManagerin taustatyöt (doWork) release-APK:sta. Vanha käyttäytyminen pidetään, kunnes kirjastot on päivitetty.
android.r8.strictFullModeForKeepRules=false
