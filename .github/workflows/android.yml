# CI: buildaa debug-APK:n ja ajaa yksikkötestit jokaisesta pushista/PR:stä.
# API-avaimet eivät ole repossa — build.gradle falbackaa tyhjiin arvoihin, mikä riittää
# käännökseen ja testeihin (release-allekirjoitus ja julkaisut tehdään paikallisesti).
name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Buildaa + yksikkötestit
        run: |
          chmod +x gradlew
          ./gradlew :app-mobile:assembleDebug :app-mobile:testDebugUnitTest --no-daemon

      - name: Testiraportti talteen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app-mobile/build/reports/tests/
          if-no-files-found: ignore
